<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- セクション一覧 -->
    <div id="sectionPage"></div>

    <!-- クイズ画面 -->
    <div id="quizPage" class="hidden">
      <div class="header">
        <div id="sectionTitle"></div>
        <div id="progress"></div>
      </div>

      <div class="card">
        <div id="questionText"></div>
      </div>

      <div id="resultArea" class="hidden"></div>

      <div class="buttons">
        <button id="btnCircle">〇</button>
        <button id="btnCross">×</button>
      </div>

      <div id="nextActions" class="hidden"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
