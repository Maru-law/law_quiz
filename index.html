<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="loading-screen" class="screen active">
      <div class="loader">データを読み込み中...</div>
    </div>

    <div id="list-screen" class="screen">
      <div class="header-simple">分野選択</div>
      <div id="category-container" class="content-scroll">
        </div>
    </div>

    <div id="quiz-screen" class="screen">
      <div class="quiz-header">
        <div class="section-title">
          <span class="bar"></span><span id="header-section-name">民法_01</span>
        </div>
      </div>
      
      <div class="quiz-content content-scroll">
        <div class="card question-card">
          <h2 id="question-number">問題 1</h2>
          <p id="question-text">問題文がここに入ります。</p>
        </div>

        <div id="result-card" class="card result-card hidden">
          <h2 id="result-title">正解</h2>
          <p id="result-text">解説がここに入ります。</p>
        </div>
      </div>

      <div class="quiz-footer">
        <div id="nav-buttons" class="nav-buttons hidden">
          <button id="btn-back-list" class="btn-secondary">問題一覧へ</button>
          <button id="btn-next" class="btn-primary">次の問題へ</button>
        </div>
        
        <div class="answer-buttons">
          <button id="btn-true" class="circle-btn">〇</button>
          <button id="btn-false" class="cross-btn">×</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
